services:
  botpass:
    build: .
    environment:
      DATABASE_URL: postgresql://botpass:botpass@postgres:5432/botpass
      FETCH_API_KEY: ${FETCH_API_KEY:?set FETCH_API_KEY in .env or your shell}
      BOTASAURUS_DOWNLOAD_TIMEOUT: "120"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9823:8080"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: botpass
      POSTGRES_USER: botpass
      POSTGRES_PASSWORD: botpass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botpass -d botpass"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - botpass-postgres:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  botpass-postgres:
